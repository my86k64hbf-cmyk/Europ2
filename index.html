<html lang="de-CH">

  <title>Colins Geografie-Lernprogramm</title>

    :root {

      --navy-2: #0c3258;
      --navy-3: #13416e;
      --turq: #2ec4b6;
      --turq-2: #1aa89b;
      --green: #3dcc7a;
      --green-2: #24965a;
      --cream: #f4fbf8;
      --text: #f3fbff;
      --muted: #b7d0e0;
      --danger: #ff6b6b;
      --warn: #ffc857;
      --ok: #3dcc7a;
      --card: #0e3a63;
      --shadow: 0 10px 30px rgba(0, 0, 0, .28);
      --radius: 16px;
      --focus: #7af0e4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 10% -10%, #156089 0%, transparent 55%),
        radial-gradient(900px 400px at 110% 0%, #0f6a5c 0%, transparent 50%),
        var(--navy);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }
    img { max-width: 100%; }
    button, select { font: inherit; }
    .skip {
      position: absolute; left: -999px; top: 0;
    }
    .skip:focus {
      left: 8px; top: 8px; z-index: 20;
      background: var(--cream); color: #07233f; padding: 8px 12px; border-radius: 8px;
    }
    .app {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 12px 12px 108px;
    }
    .top {
      background: linear-gradient(180deg, rgba(14,58,99,.92), rgba(7,35,63,.88));
      border: 1px solid rgba(46,196,182,.28);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
    }
    h1 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: .01em; }
    .sub { color: var(--muted); margin: 0 0 12px; }
    .stats {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 640px) {
      .stats { grid-template-columns: 1.4fr .8fr auto; align-items: end; }
    }
    .label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 4px; }
    .bar {
      height: 16px; background: #083050; border-radius: 999px; overflow: hidden;
      border: 1px solid rgba(122,240,228,.25);
    }
    .bar > span {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, var(--turq), var(--green));
      transition: width .35s ease;
    }
    .best {
      background: var(--navy-3);
      border-radius: 12px;
      padding: 8px 10px;
      border: 1px solid rgba(61,204,122,.35);
    }
    .best strong { color: var(--green); }
    .btn {
      appearance: none;
      border: 0;
      border-radius: 12px;
      min-height: 48px;
      padding: 12px 14px;
      background: var(--turq);
      color: #042229;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn:focus-visible, .nav-btn:focus-visible, .chip:focus-visible, .opt:focus-visible, .icon-btn:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    .btn-ghost {
      background: transparent;
      color: var(--cream);
      border: 2px solid rgba(242,251,255,.35);
    }
    .btn-danger { background: #8a2430; color: #fff; }
    .btn-ok { background: var(--green); color: #05301a; }
    .btn-wide { width: 100%; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    nav.app-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 10;
      background: rgba(7,35,63,.96);
      border-top: 1px solid rgba(46,196,182,.3);
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    @media (min-width: 760px) {
      nav.app-nav { grid-template-columns: repeat(6, 1fr); }
    }
    .nav-btn {
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: var(--navy-2);
      color: var(--text);
      font-weight: 650;
      cursor: pointer;
      touch-action: manipulation;
    }
    .nav-btn[aria-current="page"] {
      background: var(--turq);
      color: #042229;
    }
    .view { display: none; margin-top: 14px; }
    .view.is-on { display: block; }
    .card, .panel {
      background: var(--card);
      border: 1px solid rgba(46,196,182,.22);
      border-radius: var(--radius);
      padding: 14px;
      margin: 0 0 12px;
      box-shadow: var(--shadow);
    }
    h2 { font-size: 1.2rem; margin: 0 0 8px; }
    h3 { font-size: 1.05rem; margin: 16px 0 8px; }
    p { margin: 0 0 10px; }
    ul, ol { margin: 0 0 10px; padding-left: 1.2rem; }
    .muted { color: var(--muted); }
    .pill {
      display: inline-block;
      background: rgba(46,196,182,.18);
      color: #baf7f0;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: .9rem;
      margin: 0 6px 6px 0;
    }
    .mission-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .list-btn {
      width: 100%;
      text-align: left;
      background: var(--navy-2);
      color: var(--text);
      border: 1px solid rgba(46,196,182,.2);
      border-radius: 12px;
      min-height: 52px;
      padding: 10px 12px;
      margin: 0 0 8px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .list-btn small { display: block; color: var(--muted); font-weight: 500; }
    .done { border-color: var(--green); }
    .dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px;
      background: #7a93a8;
    }
    .dot.ok { background: var(--green); }
    .stoff-grid, .flag-grid, .kv-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 640px) {
      .stoff-grid, .flag-grid { grid-template-columns: 1fr 1fr; }
    }
    .mini {
      background: #0a2d4e;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,.08);
    }
    .mini h4 { margin: 0 0 6px; font-size: 1rem; }
    .flag {
      width: 72px; height: 48px; border-radius: 4px;
      border: 1px solid rgba(255,255,255,.35);
      display: block; margin-bottom: 8px;
      background: #ccc;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
    .chip {
      border: 0; border-radius: 999px; min-height: 42px; padding: 8px 12px;
      background: var(--navy-2); color: var(--text); cursor: pointer;
      touch-action: manipulation;
    }
    .chip[aria-pressed="true"] { background: var(--turq); color: #042229; font-weight: 700; }
    .flash {
      min-height: 220px;
      width: 100%;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(160deg, #0f4b73, #0a6a62);
      color: var(--cream);
      padding: 18px;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
      position: relative;
    }
    .flash-face { display: none; }
    .flash-face.is-on { display: block; }
    .flash-kicker { font-size: .9rem; color: #baf7f0; margin-bottom: 8px; }
    .flash-text { font-size: 1.15rem; font-weight: 700; }
    .flash-hint { margin-top: 16px; color: #d7fff8; font-weight: 500; }
    .pager { display: flex; gap: 8px; margin-top: 10px; }
    .pager .btn { flex: 1; }
    .opt {
      width: 100%;
      text-align: left;
      margin: 0 0 8px;
      background: #0a2d4e;
      color: var(--text);
      border: 2px solid rgba(46,196,182,.28);
      border-radius: 12px;
      min-height: 48px;
      padding: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .opt.is-right { background: #145c38; border-color: var(--green); }
    .opt.is-wrong { background: #6d2430; border-color: var(--danger); }
    .opt:disabled { cursor: default; opacity: 1; }
    .feedback {
      border-radius: 12px;
      padding: 10px 12px;
      margin: 8px 0;
    }
    .feedback.ok { background: #145c38; }
    .feedback.bad { background: #6d2430; }
    .hidden { display: none !important; }
    .ampel span {
      display: inline-block; min-width: 92px; text-align: center;
      border-radius: 999px; padding: 6px 10px; margin: 0 6px 6px 0; font-weight: 700; color: #07233f;
    }
    .ampel .g { background: var(--green); }
    .ampel .o { background: var(--warn); }
    .ampel .r { background: #ff8a8a; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
    #print-sheet { display: none; }
    @media print {
      body { background: #fff; color: #111; }
      .app { padding: 0; width: 100%; }
      .top, .app-nav, .no-print, .view { display: none !important; }
      #print-sheet { display: block !important; color: #111; }

    }
  </style>
</head>

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (err) {
        return fallback;
      }
    }
    function saveJSON(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (err) {}
    }
    function progress() { return loadJSON(KEY_PROG, {}); }
    function setProgress(p) { saveJSON(KEY_PROG, p); updateProgress(); }
    function best() {
      const n = loadJSON(KEY_BEST, null);
      return typeof n === "number" ? n : null;
    }
    function setBest(n) {
      const cur = best();
      if (cur === null || n > cur) saveJSON(KEY_BEST, n);
      updateProgress();
    }

    function todayISO() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return d.getFullYear() + "-" + m + "-" + day;
    }
    function focusDay() {
      const t = todayISO();
      if (t < "2026-09-15") return DAYS[0];
      if (t > "2026-09-24") return DAYS[DAYS.length - 1];
      return DAYS.find(function (d) { return d.id === t; }) || DAYS[0];
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (ch) {
        return ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" })[ch];
      });
    }

    function updateProgress() {
      const p = progress();
      let n = 0;
      DAYS.forEach(function (d) { if (p[d.id]) n += 1; });
      const pct = Math.round((n / DAYS.length) * 100);
      els.fill.style.width = pct + "%";
      els.bar.setAttribute("aria-valuenow", String(n));
      els.ptext.textContent = n + " von " + DAYS.length + " Tagen erledigt";
      const b = best();
      els.best.textContent = b === null ? "noch keiner" : b + " %";
    }
