    .skip{position:absolute;left:-999px}
    .skip:focus{left:8px;top:8px;z-index:20;background:#f4fbf8;color:#07233f;padding:8px 12px;border-radius:8px}
    .app{width:min(920px,100%);margin:0 auto;padding:12px 12px 118px}

    h1{font-size:1.35rem;margin:0 0 4px}
    .sub,.muted{color:var(--mu)}
    .sub{margin:0 0 12px}
    .stats{display:grid;gap:10px}
    @media(min-width:640px){.stats{grid-template-columns:1.4fr .8fr auto;align-items:end}}
    .label{display:block;font-size:.9rem;color:var(--mu);margin-bottom:4px}
    .bar{height:16px;background:#083050;border-radius:999px;overflow:hidden;border:1px solid rgba(122,240,228,.25)}
    .bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--tq),var(--gn));transition:width .35s}
    .best{background:var(--n3);border-radius:12px;padding:8px 10px;border:1px solid rgba(61,204,122,.35)}
    .best strong{color:var(--gn)}
    .btn,.nav-btn,.chip,.opt,.list-btn,.flash{touch-action:manipulation;cursor:pointer}
    .btn{appearance:none;border:0;border-radius:12px;min-height:48px;padding:12px 14px;background:var(--tq);color:#042229;font-weight:700}

    .nav-btn{min-height:48px;border:0;border-radius:12px;background:var(--n2);color:var(--tx);font-weight:650}
    .nav-btn[aria-current="page"]{background:var(--tq);color:#042229}
    .view{display:none;margin-top:14px}
    .view.is-on{display:block}
    .card{background:var(--cd);border:1px solid rgba(46,196,182,.22);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
    h2{font-size:1.2rem;margin:0 0 8px}
    h3{font-size:1.05rem;margin:16px 0 8px}
    p,ul,ol{margin:0 0 10px}
    ul,ol{padding-left:1.2rem}
    .pill{display:inline-block;background:rgba(46,196,182,.18);color:#baf7f0;border-radius:999px;padding:4px 10px;font-size:.9rem;margin:0 6px 6px 0}
    .list-btn{width:100%;text-align:left;background:var(--n2);color:var(--tx);border:1px solid rgba(46,196,182,.2);border-radius:12px;min-height:52px;padding:10px 12px;margin:0 0 8px}
    .list-btn small{display:block;color:var(--mu);font-weight:500}
    .done{border-color:var(--gn)}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:#7a93a8}
    .dot.ok{background:var(--gn)}
    .grid{display:grid;gap:10px}
    @media(min-width:640px){.grid-2{grid-template-columns:1fr 1fr}}
    .mini{background:#0a2d4e;border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,.08)}

    .flag{width:72px;height:48px;border-radius:4px;border:1px solid rgba(255,255,255,.35);margin-bottom:8px}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
    .chip{border:0;border-radius:999px;min-height:42px;padding:8px 12px;background:var(--n2);color:var(--tx)}
    .chip[aria-pressed="true"]{background:var(--tq);color:#042229;font-weight:700}
    .flash{min-height:220px;width:100%;border:0;border-radius:18px;background:linear-gradient(160deg,#0f4b73,#0a6a62);color:#f4fbf8;padding:18px;text-align:center}
    .face{display:none}
    .face.is-on{display:block}
    .kicker{font-size:.9rem;color:#baf7f0;margin-bottom:8px}
    .qtxt{font-size:1.15rem;font-weight:700}
    .hint{margin-top:16px;color:#d7fff8}
    .pager{display:flex;gap:8px;margin-top:10px}
    .pager .btn{flex:1}
    .opt{width:100%;text-align:left;margin:0 0 8px;background:#0a2d4e;color:var(--tx);border:2px solid rgba(46,196,182,.28);border-radius:12px;min-height:48px;padding:12px}
    .opt.is-right{background:#145c38;border-color:var(--gn)}
    .opt.is-wrong{background:#6d2430;border-color:#ff6b6b}
    .opt:disabled{cursor:default}
    .fb{border-radius:12px;padding:10px 12px;margin:8px 0}
    .fb.ok{background:#145c38}
    .fb.bad{background:#6d2430}
    .hidden{display:none!important}
    .ampel span{display:inline-block;min-width:92px;text-align:center;border-radius:999px;padding:6px 10px;margin:0 6px 6px 0;font-weight:700;color:#07233f}
    .g{background:var(--gn)}.o{background:#ffc857}.r{background:#ff8a8a}
    #print-sheet{display:none}
    @media print{
      body{background:#fff;color:#111}
      .app{padding:0;width:100%}
      .top,.app-nav,.no-print,.view{display:none!important}
      #print-sheet{display:block!important;color:#111}
    }
  </style>
</head>

      }
      var it=qz.items[qz.i];
      var html="<div class='card'><h2 id='quiz-title'>Frage "+(qz.i+1)+" von 10</h2><p class='qtxt'>"+esc(it.q)+"</p><div id='opts'>";
      it.opts.forEach(function(o,n){html+="<button class='opt' type='button' data-act='ans' data-n='"+n+"'"+(qz.locked?" disabled":"")+">"+esc(o)+"</button>"});
      html+="</div><div id='qfb'></div><button class='btn btn-wide hidden' type='button' id='qnext' data-act='quiz-next'>Weiter</button></div>";
      box.innerHTML=html;
    }
    function answer(n){
      var qz=S.quiz; if(!qz||qz.locked) return;
      var it=qz.items[qz.i],choice=it.opts[n];
      qz.locked=true; it.pick=choice;
      var ok=choice===it.c; if(ok) qz.score++;
      var opts=document.querySelectorAll("#opts .opt");
      for(var i=0;i<opts.length;i++){
        opts[i].disabled=true;
        if(it.opts[i]===it.c) opts[i].classList.add("is-right");
        if(i===n&&!ok) opts[i].classList.add("is-wrong");
      }
      var fb=$("qfb");
      fb.className="fb "+(ok?"ok":"bad");
      fb.innerHTML=(ok?"Richtig. ":"Falsch. Richtig ist: "+esc(it.c)+". ")+esc(it.e);
      var nx=$("qnext"); if(nx) nx.classList.remove("hidden");
    }
    function renderEltern(){
      $("view-eltern").innerHTML="<div class='card'><h2 id='eltern-title'>Für Eltern</h2><h3>Methode 5–15–10–5</h3><p>5 Minuten altes Wissen aktivieren, 15 Minuten neuen Stoff, 10 Minuten Quiz oder Zuordnung, 5 Minuten Fehler verbessern. Am Testtag höchstens 10 Minuten Wiederholung.</p><h3>Mündlich abfragen</h3><p>Möglichst viel laut fragen und auf einer Karte oder im Atlas zeigen lassen. So merkt man Unsicherheit schneller als bei Multiple Choice.</p><h3>Ampelsystem</h3><div class='ampel'><span class='g'>Grün = sicher</span><span class='o'>Orange = unsicher</span><span class='r'>Rot = nochmals üben</span></div><p>Grün: ohne Zögern richtig. Orange: richtig nach Denken. Rot: falsch oder leer.</p><h3>Veraltete Angaben im Dossier</h3><p>Kroatien verwendet den Euro seit 2023. Bulgarien verwendet den Euro seit 2026. Beide sind EU-Mitglieder mit Euro.</p><button class='btn no-print' type='button' data-act='print'>Lernübersicht drucken</button></div>";
      $("print-sheet").innerHTML="<h1>Lernübersicht Geografie Europa</h1><p>Colin · Test 24.09.2026</p><h2>Gebirge</h2><ul>"+G.map(function(g){return "<li>"+esc(g[0])+" · "+esc(g[1])+" · "+esc(g[2])+" · "+esc(g[3])+"</li>"}).join("")+"</ul><p>Erwartete Antwort höchster Berg: Mont Blanc. Elbrus nur mit Kaukasus.</p><h2>Flüsse</h2><ul>"+F.map(function(f){return "<li>"+esc(f[0])+" → "+esc(f[1])+" ("+esc(f[2])+")</li>"}).join("")+"</ul><p>Rheinländer: "+esc(RH.join(", "))+"</p><p>Donauländer: "+esc(DN.join(", "))+"</p><p>Donau-Hauptstädte: "+esc(DC.join(", "))+"</p><h2>Sprachen</h2><ul>"+SP.map(function(s){return "<li>"+esc(s[0])+": "+esc(s[1])+"</li>"}).join("")+"</ul><p>Schweiz: "+esc(CHS.join(", "))+"</p><h2>Kennzeichen</h2><p>"+KZ.map(function(k){return k[0]+" = "+k[1]}).join("; ")+"</p><h2>EU / Euro 2026</h2><p>Nicht EU: "+esc(NEU.join(", "))+"</p><p>EU ohne Euro: "+esc(EOE.join(", "))+"</p><p>Euro ausserhalb EU: "+esc(EAX.join(", "))+"</p><p>Kroatien Euro seit 2023, Bulgarien seit 2026.</p><h2>Vier Freiheiten</h2><p>Menschen, Waren, Arbeiten, Geld</p>";
    }
    document.getElementById("nav").addEventListener("click",function(e){
      var b=e.target.closest("[data-view]");
      if(!b||!this.contains(b)) return;
      e.preventDefault();
      showView(b.getAttribute("data-view"));
    });
    document.addEventListener("click",function(e){
      var t=e.target.closest("[data-act]");
      if(!t) return;
      var act=t.getAttribute("data-act");
      if(act==="goto") showView(t.getAttribute("data-view"));
      if(act==="open-day"){S.day=DAYS.filter(function(d){return d.id===t.getAttribute("data-id")})[0];showView("heute")}
      if(act==="done"){var p=prog();var id=t.getAttribute("data-id");p[id]=!p[id];save(KP,p);updProg();if(S.view==="heute")renderHeute();if(S.view==="plan")renderPlan()}
      if(act==="cat"){S.cat=t.getAttribute("data-cat");S.idx=0;S.flip=false;renderKarten()}
      if(act==="flip"){S.flip=!S.flip;paintCard()}
      if(act==="prev"){if(!S.deck.length)return;S.idx=(S.idx-1+S.deck.length)%S.deck.length;S.flip=false;paintCard()}
      if(act==="next"){if(!S.deck.length)return;S.idx=(S.idx+1)%S.deck.length;S.flip=false;paintCard()}
      if(act==="quiz-start") startQuiz();
      if(act==="ans") answer(Number(t.getAttribute("data-n")));
      if(act==="quiz-next"){if(!S.quiz)return;S.quiz.i++;S.quiz.locked=false;renderQuiz()}
      if(act==="print") window.print();
    });
    document.addEventListener("keydown",function(e){
      if(S.view!=="karten") return;
      if(e.code==="Space"||e.key===" "){e.preventDefault();S.flip=!S.flip;paintCard()}
      if(e.key==="ArrowLeft"){S.idx=(S.idx-1+S.deck.length)%S.deck.length;S.flip=false;paintCard()}
      if(e.key==="ArrowRight"){S.idx=(S.idx+1)%S.deck.length;S.flip=false;paintCard()}
    });
    $("btnReset").addEventListener("click",function(){
      if(!confirm("Fortschritt und Quiz-Bestwert auf diesem Gerät löschen?")) return;
      save(KP,{}); save(KB,null); S.day=null; updProg(); showView(S.view);
    });
    updProg();
    showView("heute");
  })();
  </script>
</body>
</html>
